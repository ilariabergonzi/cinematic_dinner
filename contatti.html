<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contatti | Cinematic Dinner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* MENU */

    .menu {
      width: 100%;
      padding: 28px 5%;
      border-bottom: 1px solid #2c2c2c;
    }

    .menu ul {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 42px;
      list-style: none;
    }

    .menu a {
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-decoration: none;
      text-transform: uppercase;
      transition: opacity 0.3s ease;
    }

    .menu a:hover {
      opacity: 0.6;
    }

    /* PAGINA CONTATTI */

    .contatti {
      width: min(700px, 90%);
      margin: 0 auto;
      padding: 80px 0 110px;
    }

    .contatti h1 {
      margin-bottom: 18px;
      font-size: clamp(42px, 7vw, 75px);
      line-height: 1;
      letter-spacing: -3px;
      text-align: center;
      text-transform: uppercase;
    }

    .introduzione {
      margin-bottom: 45px;
      color: #c8c8c8;
      font-size: 18px;
      line-height: 1.5;
      text-align: center;
    }

    .contatti-form {
      display: grid;
      gap: 24px;
    }

    .campo {
      display: grid;
      gap: 9px;
    }

    .campo label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .campo input,
    .campo textarea {
      width: 100%;
      padding: 16px;
      border: 1px solid #555555;
      border-radius: 0;
      outline: none;
      background-color: #181818;
      color: #ffffff;
      font: inherit;
      transition: border-color 0.3s ease;
    }

    .campo input:focus,
    .campo textarea:focus {
      border-color: #ffffff;
    }

    .campo textarea {
      min-height: 190px;
      resize: vertical;
    }

    .invia {
      margin-top: 10px;
      padding: 17px 28px;
      border: 1px solid #ffffff;
      background-color: #ffffff;
      color: #0d0d0d;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition:
        background-color 0.3s ease,
        color 0.3s ease;
    }

    .invia:hover {
      background-color: transparent;
      color: #ffffff;
    }

    /* Campo invisibile antispam */

    .campo-esca {
      display: none;
    }

    /* VERSIONE TELEFONO */

    @media (max-width: 750px) {
      .menu {
        padding: 22px 20px;
        overflow-x: auto;
      }

      .menu ul {
        width: max-content;
        justify-content: flex-start;
        gap: 25px;
      }

      .menu a {
        font-size: 12px;
        white-space: nowrap;
      }

      .contatti {
        padding-top: 60px;
      }
    }
  </style>
</head>

<body>

  <nav class="menu">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="progetto.html">Il progetto</a></li>
      <li><a href="collabora.html">Collabora con noi</a></li>
      <li><a href="eventi.html">Eventi</a></li>
      <li><a href="contatti.html">Contatti</a></li>
    </ul>
  </nav>

  <main class="contatti">

    <h1>Contatti</h1>

    <p class="introduzione">
      Scrivici per informazioni, domande o proposte di collaborazione.
    </p>

    <form
      class="contatti-form"
      action="https://formsubmit.co/ilaria.bergo.bergonzi@gmail.com"
      method="POST"
    >

      <input
        type="hidden"
        name="_subject"
        value="Nuovo messaggio dal sito Cinematic Dinner"
      >

      <input
        type="hidden"
        name="_template"
        value="table"
      >

      <input
        class="campo-esca"
        type="text"
        name="_honey"
        tabindex="-1"
        autocomplete="off"
      >

      <div class="campo">
        <label for="nome">Nome</label>
        <input
          type="text"
          id="nome"
          name="Nome"
          autocomplete="given-name"
          required
        >
      </div>

      <div class="campo">
        <label for="cognome">Cognome</label>
        <input
          type="text"
          id="cognome"
          name="Cognome"
          autocomplete="family-name"
          required
        >
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        >
      </div>

      <div class="campo">
        <label for="messaggio">Messaggio</label>
        <textarea
          id="messaggio"
          name="Messaggio"
          required
        ></textarea>
      </div>

      <button class="invia" type="submit">
        Invia messaggio
      </button>

    </form>

  </main>

</body>
</html>
