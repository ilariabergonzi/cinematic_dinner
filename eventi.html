<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eventi in programma</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* MENU */

    .menu {
      width: 100%;
      padding: 28px 5%;
      border-bottom: 1px solid #2c2c2c;
    }
    
    .menu ul {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 42px;
      list-style: none;
    }
    
    .menu a {
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-decoration: none;
      text-transform: uppercase;
      transition: opacity 0.3s ease;
    }
    
    .menu a:hover {
      opacity: 0.6;
    }
    
        .eventi {
          width: min(1200px, 90%);
          margin: 0 auto;
          padding: 90px 0 110px;
        }

    .eventi h1 {
      margin-bottom: 60px;
      text-align: center;
      font-size: clamp(42px, 7vw, 88px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -3px;
      text-transform: uppercase;
    }

    .eventi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .evento-card {
      display: block;
      overflow: hidden;
      background-color: #181818;
      color: #ffffff;
      text-decoration: none;
      border: 1px solid #2c2c2c;
      transition:
        transform 0.3s ease,
        border-color 0.3s ease;
    }

    .evento-card:hover {
      transform: translateY(-8px);
      border-color: #ffffff;
    }

    .evento-card img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .evento-card:hover img {
      transform: scale(1.03);
    }

    .evento-info {
      padding: 25px 22px 28px;
    }

    .evento-info h2 {
      margin-bottom: 14px;
      font-size: 25px;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .evento-luogo,
    .evento-data {
      color: #c8c8c8;
      font-size: 16px;
      line-height: 1.5;
    }

    .evento-data {
      margin-top: 8px;
      color: #ffffff;
      font-weight: 700;
    }
    
    @media (max-width: 750px) {
      .menu {
        padding: 22px 20px;
        overflow-x: auto;
      }
    
      .menu ul {
        width: max-content;
        justify-content: flex-start;
        gap: 25px;
      }
    
      .menu a {
        font-size: 12px;
        white-space: nowrap;
      }
    }
    
    @media (max-width: 850px) {
      .eventi {
        padding-top: 65px;
      }

      .eventi h1 {
        margin-bottom: 45px;
        letter-spacing: -2px;
      }

      .eventi-grid {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .evento-card {
        max-width: 520px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
 
  <nav class="menu">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="progetto.html">Il progetto</a></li>
      <li><a href="collabora.html">Collabora con noi</a></li>
      <li><a href="eventi.html">Eventi</a></li>
      <li><a href="contatti.html">Contatti</a></li>
    </ul>
  </nav>

  <main class="eventi">

    <h1>Eventi in programma</h1>

    <div class="eventi-grid">

      <a class="evento-card" href="evento-barbie.html">
        <img src="images/barbie.jpeg" alt="Locandina dell'evento Barbie">

        <div class="evento-info">
          <h2>Barbie</h2>
          <p class="evento-luogo">Ristorante Blabla · Soncino</p>
          <p class="evento-data">14 settembre</p>
        </div>
      </a>

      <a class="evento-card" href="evento-interstellar.html">
        <img src="images/interstellar.jpg" alt="Locandina dell'evento Interstellar">

        <div class="evento-info">
          <h2>Interstellar</h2>
          <p class="evento-luogo">Ristorante Pippo · Lonato del Garda</p>
          <p class="evento-data">15 settembre</p>
        </div>
      </a>

      <a class="evento-card" href="evento-follie-imperatore.html">
        <img
          src="images/follie-imperatore.jpeg"
          alt="Locandina dell'evento Le follie dell'imperatore"
        >

        <div class="evento-info">
          <h2>Le follie dell’imperatore</h2>
          <p class="evento-luogo">Ristorante Cucu · Brescia</p>
          <p class="evento-data">16 settembre</p>
        </div>
      </a>

    </div>

  </main>

</body>
</html>
